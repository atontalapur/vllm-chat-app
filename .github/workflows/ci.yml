name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first — no point burning runners on
# a diff nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff@0.14.2 check .

      - name: Format check
        run: uvx ruff@0.14.2 format --check .

      # The eval set is the ruler every promotion is measured with. A malformed
      # item fails silently at scoring time, so the schema is checked here.
      - name: Validate eval set
        run: python3 pipeline/eval/validate.py pipeline/eval/worldcup-v1.jsonl

  types-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Type check
        run: uv run mypy app

      # The upstream model server is mocked, so the full request path is
      # covered here without a GPU runner.
      - name: Test
        run: uv run pytest -q

  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Test
        run: uv run pytest -q

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose config` only parses YAML. Without an actual build, a
      # broken Dockerfile merges undetected and fails on the GPU box, where a
      # rebuild costs a cold start on billed time.
      - name: Build api image
        run: docker build ./api

      - name: Build ui image
        run: docker build ./ui

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches compose syntax and interpolation errors without needing a GPU:
      # the stack itself can't run in CI, but a broken compose file can and
      # should fail here rather than after a 10-minute cold start on a paid box.
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          # .env.example ships required secrets empty on purpose, and compose
          # refuses to interpolate an empty ${VAR:?} — that guard is what stops
          # a real deployment starting up unconfigured. Supply throwaway values
          # here rather than weakening the guard.
          {
            echo "API_KEY=ci-validation-only"
            echo "GF_SECURITY_ADMIN_PASSWORD=ci-validation-only"
            echo "POSTGRES_PASSWORD=ci-validation-only"
          } >> .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
          echo "both compose configurations valid"

      # The trace store needs no GPU, so its migration runs for real here:
      # a migration that fails to apply blocks api from starting on the box.
      - name: Apply migrations
        run: |
          # psql via the db-migrate service, so the checks do not depend on
          # postgres surviving --exit-code-from (compose versions differ there).
          q() { docker compose run --rm --entrypoint psql db-migrate -tAc "$1"; }
          docker compose up --quiet-pull --exit-code-from db-migrate db-migrate
          q "SELECT 1 FROM information_schema.columns WHERE table_name = 'traces' AND column_name = 'request_id'" | grep -q 1
          # Second run must be a no-op: exits 0 and records nothing new.
          before=$(q 'SELECT count(*) FROM schema_migrations')
          docker compose up --exit-code-from db-migrate db-migrate
          after=$(q 'SELECT count(*) FROM schema_migrations')
          test "$before" = "$after"
          # A broken file must exit non-zero, roll back its DDL, and record nothing.
          mkdir -p bad && cp pipeline/db/migrations/*.sql bad/
          echo 'CREATE TABLE half (x int); SELECT 1/0;' > bad/0002_bad.sql
          ! docker compose run --rm -e MIGRATIONS_DIR=/bad -v "$PWD/bad:/bad:ro" db-migrate
          test "$(q 'SELECT count(*) FROM schema_migrations')" = "$after"
          test -z "$(q "SELECT to_regclass('half')")"
          # An edited applied file must be refused: applied migrations are immutable.
          rm bad/0002_bad.sql && echo '-- edited after apply' >> bad/0001_traces.sql
          ! docker compose run --rm -e MIGRATIONS_DIR=/bad -v "$PWD/bad:/bad:ro" db-migrate
          docker compose down -v
