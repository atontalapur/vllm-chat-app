[project]
name = "vllm-chat-api"
version = "0.1.0"
description = "Application layer between the chat UI and the model server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
