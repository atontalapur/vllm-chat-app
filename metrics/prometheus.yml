# Scrapes both the model server and the application layer.
#
# 5s interval rather than the usual 15s: the point of this dashboard is to
# watch a queue form and drain during a short load burst, and at 15s a burst
# lasting under a minute is only a couple of samples wide.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # vLLM's own engine metrics: queue depth, TTFT, tokens, KV cache.
  # Absent when running the GPU-free local overlay, where there is no vllm
  # service — Prometheus simply reports the target as down.
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

  # Application layer metrics from prometheus-fastapi-instrumentator.
  # Unauthenticated on purpose: Prometheus holds no API key.
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
